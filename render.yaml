services:
  - type: web
    name: careercompass
    runtime: java
    buildCommand: mvn -B clean package -DskipTests
    startCommand: java -Dspring.profiles.active=prod -jar target/CareerCompass-1.0.0.jar
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        sync: false          # set this manually in the Render dashboard
      - key: DB_USERNAME
        sync: false          # set this manually in the Render dashboard
      - key: DB_PASSWORD
        sync: false          # set this manually in the Render dashboard
      - key: PORT
        value: "8080"
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: COOKIE_SECURE
        value: "true"
      - key: MAX_FILE_SIZE
        value: "10MB"
      - key: MAX_REQUEST_SIZE
        value: "10MB"
