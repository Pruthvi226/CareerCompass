<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Exams - CareerCompass</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/admin/dashboard}">CareerCompass Admin</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/admin/dashboard}">Dashboard</a>
    </div>
</nav>
<main class="container py-4">
    <h2 class="fw-bold">Manage Exams</h2>
    <div class="row g-4">
        <div class="col-lg-5">
            <div class="card border-0 shadow-sm">
                <div class="card-body">
                    <h5>Add Exam</h5>
                    <form method="post" th:action="@{/admin/exams/add}" th:object="${examDTO}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <label class="form-label">Exam</label>
                        <select class="form-select mb-3" th:field="*{examType}" required>
                            <option value="">Choose</option>
                            <option th:each="type : ${examTypes}" th:value="${type.name()}" th:text="${type.displayName + ' - ' + type.category}"></option>
                        </select>
                        <label class="form-label">Counselling Body</label>
                        <input class="form-control mb-3" th:field="*{counsellingBody}" placeholder="JoSAA, MCC, TSCHE">
                        <label class="form-label">Description</label>
                        <textarea class="form-control mb-3" th:field="*{description}" rows="3" required></textarea>
                        <button class="btn btn-primary" type="submit">Save Exam</button>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-lg-7">
            <table class="table table-hover bg-white">
                <thead class="table-dark"><tr><th>Exam</th><th>Category</th><th>Counselling</th><th>Status</th></tr></thead>
                <tbody>
                <tr th:each="exam : ${exams}">
                    <td th:text="${exam.examType.displayName}"></td>
                    <td th:text="${exam.examType.category}"></td>
                    <td th:text="${exam.counsellingBody ?: 'NA'}"></td>
                    <td><span class="badge text-bg-success" th:if="${exam.isActive}">Active</span></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
