<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users - CareerCompass</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/admin/dashboard}">CareerCompass Admin</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/admin/dashboard}">Dashboard</a>
    </div>
</nav>
<main class="container py-4">
    <h2 class="fw-bold">Manage Students</h2>
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <table class="table table-hover bg-white align-middle">
        <thead class="table-dark"><tr><th>Name</th><th>Email</th><th>State</th><th>Category</th><th>Gender</th><th></th></tr></thead>
        <tbody>
        <tr th:each="student : ${students}">
            <td th:text="${student.fullName}"></td>
            <td th:text="${student.email}"></td>
            <td th:text="${student.state ?: 'NA'}"></td>
            <td th:text="${student.category ?: 'NA'}"></td>
            <td th:text="${student.gender ?: 'NA'}"></td>
            <td class="text-end">
                <form method="post" th:action="@{/admin/users/delete/{id}(id=${student.id})}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button class="btn btn-sm btn-outline-danger" type="submit">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
