<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Branches - CareerCompass</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/admin/dashboard}">CareerCompass Admin</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/admin/branches/add}">Add Course</a>
    </div>
</nav>
<main class="container py-4">
    <h2 class="fw-bold">Manage Courses and Branches</h2>
    <table class="table table-hover bg-white">
        <thead class="table-dark"><tr><th>Name</th><th>Code</th><th>Degree</th><th>Duration</th><th>Status</th></tr></thead>
        <tbody>
        <tr th:each="branch : ${branches}">
            <td th:text="${branch.name}"></td>
            <td th:text="${branch.branchCode}"></td>
            <td th:text="${branch.degreeType}"></td>
            <td th:text="${branch.duration + ' years'}"></td>
            <td><span class="badge text-bg-success" th:if="${branch.isActive}">Active</span></td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
