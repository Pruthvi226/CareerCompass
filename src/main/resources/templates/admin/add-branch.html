<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Course - CareerCompass</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/admin/dashboard}">CareerCompass Admin</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/admin/branches}">Back</a>
    </div>
</nav>
<main class="container py-4">
    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <h2 class="fw-bold">Add Course / Branch</h2>
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
            <form method="post" th:action="@{/admin/branches/add}" th:object="${branchDTO}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="row g-3">
                    <div class="col-md-5"><label class="form-label">Name</label><input class="form-control" th:field="*{name}" required></div>
                    <div class="col-md-2"><label class="form-label">Code</label><input class="form-control" th:field="*{branchCode}" required></div>
                    <div class="col-md-3"><label class="form-label">Degree</label><select class="form-select" th:field="*{degreeType}" required><option value="">Choose</option><option th:each="type : ${degreeTypes}" th:value="${type.name()}" th:text="${type.displayName}"></option></select></div>
                    <div class="col-md-2"><label class="form-label">Duration</label><input type="number" class="form-control" th:field="*{duration}" required></div>
                    <div class="col-12"><label class="form-label">Description</label><textarea class="form-control" th:field="*{description}" rows="3"></textarea></div>
                </div>
                <button class="btn btn-primary mt-4" type="submit">Save Course</button>
            </form>
        </div>
    </div>
</main>
</body>
</html>
