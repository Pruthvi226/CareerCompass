<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Colleges - CareerCompass</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/admin/dashboard}">CareerCompass Admin</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/admin/colleges/add}">Add College</a>
    </div>
</nav>
<main class="container py-4">
    <h2 class="fw-bold">Manage Colleges</h2>
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div class="table-responsive">
        <table class="table table-hover bg-white align-middle">
            <thead class="table-dark">
            <tr><th>Name</th><th>Type</th><th>Location</th><th>Fees</th><th>NIRF</th><th>Status</th></tr>
            </thead>
            <tbody>
            <tr th:each="college : ${colleges}">
                <td><a th:href="@{/colleges/{id}(id=${college.id})}" th:text="${college.name}"></a></td>
                <td th:text="${college.collegeType}"></td>
                <td th:text="${college.city + ', ' + college.state}"></td>
                <td th:text="${college.fees ?: 'NA'}"></td>
                <td th:text="${college.nirfRank ?: 'NA'}"></td>
                <td><span class="badge text-bg-success" th:if="${college.isActive}">Active</span></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
