<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add College - CareerCompass</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/admin/dashboard}">CareerCompass Admin</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/admin/colleges}">Back</a>
    </div>
</nav>
<main class="container py-4">
    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <h2 class="fw-bold">Add College</h2>
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
            <form method="post" th:action="@{/admin/colleges/add}" th:object="${collegeDTO}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="row g-3">
                    <div class="col-md-6"><label class="form-label">Name</label><input class="form-control" th:field="*{name}" required></div>
                    <div class="col-md-3"><label class="form-label">Type</label><select class="form-select" th:field="*{collegeType}" required><option value="">Choose</option><option th:each="type : ${collegeTypes}" th:value="${type.name()}" th:text="${type.displayName}"></option></select></div>
                    <div class="col-md-3"><label class="form-label">Counselling</label><input class="form-control" th:field="*{counsellingType}" placeholder="JoSAA, MCC"></div>
                    <div class="col-md-4"><label class="form-label">City</label><input class="form-control" th:field="*{city}" required></div>
                    <div class="col-md-4"><label class="form-label">State</label><input class="form-control" th:field="*{state}" required></div>
                    <div class="col-md-4"><label class="form-label">Website</label><input class="form-control" th:field="*{website}"></div>
                    <div class="col-md-3"><label class="form-label">Fees</label><input type="number" class="form-control" th:field="*{fees}"></div>
                    <div class="col-md-3"><label class="form-label">Avg Package</label><input type="number" class="form-control" th:field="*{averagePackage}"></div>
                    <div class="col-md-3"><label class="form-label">Highest Package</label><input type="number" class="form-control" th:field="*{highestPackage}"></div>
                    <div class="col-md-3"><label class="form-label">Placement %</label><input type="number" class="form-control" th:field="*{placementPercentage}" min="0" max="100"></div>
                    <div class="col-md-3"><label class="form-label">NIRF Rank</label><input type="number" class="form-control" th:field="*{nirfRank}"></div>
                    <div class="col-md-3"><label class="form-label">Campus Acres</label><input type="number" class="form-control" th:field="*{campusSize}"></div>
                    <div class="col-md-3"><label class="form-label">Seat Intake</label><input type="number" class="form-control" th:field="*{seatIntake}"></div>
                    <div class="col-md-3 d-flex align-items-end"><div class="form-check"><input class="form-check-input" type="checkbox" th:field="*{hostelAvailable}"><label class="form-check-label">Hostel</label></div></div>
                    <div class="col-md-6"><label class="form-label">Bond Details</label><input class="form-control" th:field="*{bondDetails}"></div>
                    <div class="col-md-6"><label class="form-label">Stipend Details</label><input class="form-control" th:field="*{stipendDetails}"></div>
                    <div class="col-md-4 d-flex align-items-end"><div class="form-check"><input class="form-check-input" type="checkbox" th:field="*{hospitalAttached}"><label class="form-check-label">Hospital Attached</label></div></div>
                    <div class="col-md-8"><label class="form-label">Annual Patient Flow</label><input class="form-control" th:field="*{annualPatientFlow}" placeholder="High, Medium, Low"></div>
                    <div class="col-12"><label class="form-label">Description</label><textarea class="form-control" th:field="*{description}" rows="3"></textarea></div>
                </div>
                <button class="btn btn-primary mt-4" type="submit">Save College</button>
            </form>
        </div>
    </div>
</main>
</body>
</html>
