<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - CareerCompass</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg cc-navbar sticky-top">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" th:href="@{/student/dashboard}">
            <span class="cc-brand-mark"><i class="fas fa-compass"></i></span>
            CareerCompass
        </a>
        <form method="post" th:action="@{/logout}" class="m-0">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="btn btn-primary btn-sm" type="submit">Logout</button>
        </form>
    </div>
</nav>

<header class="cc-page-title">
    <div class="container">
        <span class="cc-eyebrow mb-3"><i class="fas fa-user-gear"></i> Profile</span>
        <h1>Student profile</h1>
        <p class="text-muted mb-0">Keep counselling details updated for faster prediction forms and better saved context.</p>
    </div>
</header>

<main class="cc-page-shell">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <section class="cc-panel">
                    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
                        <span th:text="${successMessage}">Profile updated</span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                    <form method="post" th:action="@{/student/profile}" th:object="${userDTO}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input type="hidden" th:field="*{email}">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label" for="fullName">Full name</label>
                                <input id="fullName" class="form-control" th:field="*{fullName}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="email">Email</label>
                                <input id="email" class="form-control" th:value="${user.email}" disabled>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="phone">Phone</label>
                                <input id="phone" class="form-control" th:field="*{phone}" placeholder="10 digit mobile">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="state">Home state</label>
                                <input id="state" class="form-control" th:field="*{state}" placeholder="Telangana">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="category">Category</label>
                                <select id="category" class="form-select" th:field="*{category}">
                                    <option value="">Select</option>
                                    <option value="GENERAL">General</option>
                                    <option value="EWS">EWS</option>
                                    <option value="OBC">OBC</option>
                                    <option value="SC">SC</option>
                                    <option value="ST">ST</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="gender">Gender</label>
                                <select id="gender" class="form-select" th:field="*{gender}">
                                    <option value="">Select</option>
                                    <option value="MALE">Male</option>
                                    <option value="FEMALE">Female</option>
                                    <option value="GENDER_NEUTRAL">Gender Neutral</option>
                                </select>
                            </div>
                        </div>
                        <div class="d-flex flex-wrap gap-2 mt-4">
                            <button class="btn btn-primary" type="submit">
                                <i class="fas fa-floppy-disk me-1"></i>Save Profile
                            </button>
                            <a class="btn btn-outline-secondary" th:href="@{/student/dashboard}">Back to Dashboard</a>
                        </div>
                    </form>
                </section>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
