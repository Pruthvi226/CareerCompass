<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choice Filling Planner - CareerCompass</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg cc-navbar sticky-top">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" th:href="@{/student/dashboard}">
            <span class="cc-brand-mark"><i class="fas fa-compass"></i></span>
            CareerCompass
        </a>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-secondary btn-sm" th:href="@{/student/predictor}">Predictor</a>
            <a class="btn btn-primary btn-sm" th:href="@{/student/wishlist}">Wishlist</a>
        </div>
    </div>
</nav>

<header class="cc-page-title">
    <div class="container">
        <span class="cc-eyebrow mb-3"><i class="fas fa-list-ol"></i> Counselling order</span>
        <h1>Choice filling planner</h1>
        <p class="text-muted mb-0">Generate a practical order: Dream choices first, Moderate next, Safe colleges last.</p>
    </div>
</header>

<main class="cc-page-shell">
    <div class="container">
        <form method="post" th:action="@{/student/predictor/choice-filling}" class="cc-panel mb-4">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label" for="examId">Exam</label>
                    <select id="examId" name="examId" class="form-select" required>
                        <option value="">Choose</option>
                        <option th:each="exam : ${exams}" th:value="${exam.id}" th:text="${exam.examType.displayName}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label" for="rank">Rank</label>
                    <input id="rank" type="number" name="rank" class="form-control" min="1" required>
                </div>
                <div class="col-md-2">
                    <label class="form-label" for="category">Category</label>
                    <select id="category" name="category" class="form-select" required>
                        <option value="GENERAL">General</option>
                        <option value="EWS">EWS</option>
                        <option value="OBC">OBC</option>
                        <option value="SC">SC</option>
                        <option value="ST">ST</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label" for="gender">Gender</label>
                    <select id="gender" name="gender" class="form-select" required>
                        <option value="MALE">Male</option>
                        <option value="FEMALE">Female</option>
                        <option value="GENDER_NEUTRAL">Neutral</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label" for="quota">Quota</label>
                    <select id="quota" name="quota" class="form-select" required>
                        <option value="ALL_INDIA">All India</option>
                        <option value="HOME_STATE">Home State</option>
                        <option value="FOREIGN">Foreign</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="preferredBranch">Course / Branch</label>
                    <input id="preferredBranch" name="preferredBranch" class="form-control" placeholder="CSE, MBBS, BDS">
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="statePreference">State preference</label>
                    <input id="statePreference" name="statePreference" class="form-control" placeholder="Telangana">
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="maxFees">Max fees</label>
                    <input id="maxFees" name="maxFees" type="number" class="form-control" min="0">
                </div>
            </div>
            <button class="btn btn-primary mt-3" type="submit">
                <i class="fas fa-list-check me-1"></i>Generate Order
            </button>
        </form>

        <div class="cc-table-wrap table-responsive" th:if="${choiceOrder != null && !#lists.isEmpty(choiceOrder)}">
            <table class="table table-hover align-middle">
                <thead>
                <tr>
                    <th>Priority</th>
                    <th>College</th>
                    <th>Course</th>
                    <th>Chance</th>
                    <th>Reason</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="choice, iter : ${choiceOrder}">
                    <td class="fw-bold" th:text="${iter.index + 1}">1</td>
                    <td th:text="${choice.collegeName}">College</td>
                    <td th:text="${choice.branchName}">Course</td>
                    <td>
                        <span class="badge"
                              th:classappend="${choice.predictionType == 'SAFE' ? ' text-bg-success' : (choice.predictionType == 'MODERATE' ? ' text-bg-warning' : ' text-bg-danger')}"
                              th:text="${choice.predictionType + ' ' + choice.chancePercentage + '%'}">SAFE 90%</span>
                    </td>
                    <td th:text="${choice.advice}">Reason</td>
                </tr>
                </tbody>
            </table>
        </div>

        <div th:if="${choiceOrder == null || #lists.isEmpty(choiceOrder)}" class="cc-note">
            Enter your rank and filters above to generate a choice order.
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
